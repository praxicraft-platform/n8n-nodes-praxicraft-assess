name: Publish to npm

# On push to main (package paths) or manual dispatch:
# test → build → npm publish --provenance → create v{version} git tag.
# Skips publish if that version is already on npm (idempotent re-runs).
#
# Bump package.json version before merging changes you want released.
# Prefer npm Trusted Publishing (OIDC); NPM_TOKEN is a fallback.
on:
  push:
    branches: [main]
    paths:
      - "nodes/**"
      - "credentials/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "gulpfile.js"
      - ".github/workflows/publish.yml"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Read package version
        id: pkg
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Package version: ${VERSION}"

      - name: Check if version already published
        id: npm
        run: |
          VERSION="${{ steps.pkg.outputs.version }}"
          if npm view "@praxicraft/n8n-nodes-assess@${VERSION}" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Version ${VERSION} is already on npm — skipping publish."
            exit 0
          fi
          # Unpublished versions stay blocked forever; `time` still lists them.
          if npm view "@praxicraft/n8n-nodes-assess" time --json 2>/dev/null \
            | node -e "const t=JSON.parse(require('fs').readFileSync(0,'utf8')); process.exit(t['${VERSION}']?0:1)"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::error::Version ${VERSION} was published before (even if unpublished). Bump package.json — npm never reuses version numbers."
            exit 1
          fi
          echo "exists=false" >> "$GITHUB_OUTPUT"
          echo "Version ${VERSION} not on npm — will publish."

      - run: npm ci --ignore-scripts
        if: steps.npm.outputs.exists != 'true'

      - run: npm test
        if: steps.npm.outputs.exists != 'true'

      - run: npm run build
        if: steps.npm.outputs.exists != 'true'

      - name: Publish with provenance
        if: steps.npm.outputs.exists != 'true'
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create and push v* tag if missing
        if: steps.npm.outputs.exists != 'true'
        run: |
          VERSION="${{ steps.pkg.outputs.version }}"
          TAG="v${VERSION}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"
          echo "Created and pushed $TAG."

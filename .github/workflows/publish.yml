name: Publish to npm

on:
  push:
    branches: [main]
    paths:
      - "nodes/**"
      - "credentials/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "gulpfile.js"
      - ".github/workflows/publish.yml"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish-n8n
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    if: |
      github.event_name == 'workflow_dispatch' || (
        github.event.head_commit != null &&
        !startsWith(github.event.head_commit.message, 'chore(release):') &&
        !contains(github.event.head_commit.message, '[skip release]')
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Auto-bump patch version and CHANGELOG
        id: version
        run: |
          set -euo pipefail
          git fetch --tags --force
          LATEST="$(git describe --tags --abbrev=0 2>/dev/null || echo 'v0.0.0')"
          RAW="${LATEST#v}"
          IFS=. read -r MAJOR MINOR PATCH <<<"$RAW"
          MAJOR="${MAJOR:-0}"; MINOR="${MINOR:-0}"; PATCH="${PATCH:-0}"
          PATCH=$((PATCH + 1))
          VERSION="${MAJOR}.${MINOR}.${PATCH}"
          TAG="v${VERSION}"
          NOTES="$(git log "${LATEST}..HEAD" --pretty=format:'- %s' --no-merges 2>/dev/null | sed '/^chore(release):/d' || true)"
          if [ -z "$NOTES" ]; then NOTES="- Maintenance release."; fi
          export VERSION NOTES
          node <<'NODE'
          const fs = require("fs");
          const v = process.env.VERSION;
          const notes = process.env.NOTES;
          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          pkg.version = v;
          fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
          let body = fs.existsSync("CHANGELOG.md") ? fs.readFileSync("CHANGELOG.md", "utf8") : "# Changelog\n\n";
          const idx = body.indexOf("## ");
          const prior = idx >= 0 ? body.slice(idx) : "";
          fs.writeFileSync("CHANGELOG.md", `# Changelog\n\n## ${v}\n\n${notes}\n\n${prior}`);
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json CHANGELOG.md
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): ${TAG}"
            git push origin HEAD:main
          fi
          {
            echo "version=${VERSION}"
            echo "tag=${TAG}"
          } >> "$GITHUB_OUTPUT"

      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build

      - name: Publish with provenance
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create and push tag
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse "$TAG" >/dev/null 2>&1; then echo "Tag exists"; exit 0; fi
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - run: npm pack

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            praxicraft-n8n-nodes-assess-*.tgz
